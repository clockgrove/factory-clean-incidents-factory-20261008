<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident explorer</title><link rel="stylesheet" href="/style.css"></head><body><header><span>SUPPORT OPERATIONS · FICTIONAL DATA</span><h1>Incident explorer</h1><p>Find the signal. Understand the incident.</p></header><main><section aria-label="Selections" class="panel"><label>Search incidents<input id="q" type="search" placeholder="ID, title or description"></label><div id="filters"></div><div class="controls"><label>Opened from (UTC)<input id="from" type="date"></label><label>Opened through (UTC)<input id="to" type="date"></label><label>Sort<select id="sort" aria-label="Sort"><option value="openedAt">Opened date</option><option value="severity">Severity</option></select></label><label>Direction<select id="direction"><option value="desc">Highest / newest first</option><option value="asc">Lowest / oldest first</option></select></label><label>Rows per page<select id="size"><option>25</option><option>50</option></select></label><button id="clear">Clear selections</button></div><p id="active"></p><div class="controls"><label>View name<input id="viewName" maxlength="80"></label><button id="save">Save view</button><label>Saved views<select id="views"><option value="">Choose a view</option></select></label><button id="restore">Open view</button><button id="delete">Delete view</button><a id="export" href="/api/export">Export CSV</a></div><p id="viewMessage" role="status"></p></section><p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>Retry</button><section id="results"><div id="counts" class="counts"></div><details class="panel"><summary>Incidents opened by day · complete filtered result</summary><div id="chart" aria-label="Daily incident counts"></div></details><div class="table-wrap"><table><caption>Matching incidents</caption><thead><tr><th>Incident</th><th>Service</th><th>Severity</th><th>Status</th><th>Opened (UTC)</th></tr></thead><tbody id="rows"></tbody></table></div><nav aria-label="Pagination"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></nav></section><section id="detail" class="panel" hidden><button id="back">Back to results</button><h2>Incident details</h2><div id="detailBody"></div></section></main><script type="module" src="/app.js"></script></body></html>
